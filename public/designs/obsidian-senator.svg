<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg-obsidian-senator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161617"/>
      <stop offset="100%" stop-color="#0D0D0E"/>
    </linearGradient>
    <radialGradient id="glow-obsidian-senator" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#8A847C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D0D0E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg-obsidian-senator)"/>
  <rect width="800" height="1000" fill="url(#glow-obsidian-senator)"/>
  
  <!-- Subtle Framing -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#8A847C" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Garment Illustration -->
  <g transform="translate(400, 520)">
    
      <!-- Senator Tunic & Shoulders -->
      <path d="M-140,260 L-130,-70 L-70,-115 C-40,-125 40,-125 70,-115 L130,-70 L140,260 Z"
        fill="#121213" stroke="#8A847C" stroke-opacity="0.45" stroke-width="2"/>
      
      <!-- Neck Cutout Curve -->
      <path d="M-36,-118 C-25,-85 25,-85 36,-118 C20,-130 -20,-130 -36,-118 Z" 
        fill="#0E0E0E" stroke="#8A847C" stroke-width="2"/>

      <!-- Asymmetric Senator Placket -->
      <path d="M15,-85 L15,220" stroke="#8A847C" stroke-width="2.5"/>
      <rect x="10" y="-30" width="10" height="24" rx="2" fill="#8A847C"/>
      <rect x="10" y="30" width="10" height="24" rx="2" fill="#8A847C"/>
      <rect x="10" y="90" width="10" height="24" rx="2" fill="#8A847C"/>
      
      <!-- Pocket welt -->
      <line x1="-70" y1="10" x2="-25" y2="10" stroke="#8A847C" stroke-width="2"/>
      <!-- Side slits -->
      <line x1="-125" y1="180" x2="-125" y2="260" stroke="#8A847C" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="125" y1="180" x2="125" y2="260" stroke="#8A847C" stroke-width="1.5" stroke-dasharray="2,2"/>
    
  </g>
  
  <!-- Brand and Title Header in SVG -->
  <text x="400" y="80" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.18em" fill="#F6F3EE">OBSIDIAN SENATOR SUIT</text>
  <text x="400" y="108" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.25em" fill="#8A847C">EZEKIEL BESPOKE ATELIER</text>
  
  <!-- Placeholder indicator -->
  <rect x="300" y="920" width="200" height="26" rx="13" fill="#000000" fill-opacity="0.5" stroke="#8A847C" stroke-opacity="0.25"/>
  <text x="400" y="937" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="0.15em" fill="#8A847C">PREVIEW PLACEHOLDER</text>
</svg>