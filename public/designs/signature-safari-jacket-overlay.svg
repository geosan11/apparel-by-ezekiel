<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <g transform="translate(300, 360)">
    
      <!-- Safari Jacket Body -->
      <path d="M-140,260 L-130,-70 L-70,-115 C-40,-125 40,-125 70,-115 L130,-70 L140,260 Z"
        fill="#282C24" stroke="#B89B6A" stroke-opacity="0.85" stroke-width="2"/>
      
      <!-- Open Collar -->
      <path d="M-40,-118 L-20,-70 L0,-90 L20,-70 L40,-118 Z" 
        fill="none" stroke="#B89B6A" stroke-width="2"/>
      
      <!-- Four Bellows Pockets -->
      <!-- Top Left -->
      <rect x="-85" y="-30" width="45" height="50" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <path d="M-85,-20 L-40,-20" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Top Right -->
      <rect x="40" y="-30" width="45" height="50" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <path d="M40,-20 L85,-20" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Bottom Left -->
      <rect x="-95" y="100" width="55" height="65" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Bottom Right -->
      <rect x="40" y="100" width="55" height="65" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      
      <!-- Center Placket -->
      <line x1="0" y1="-70" x2="0" y2="260" stroke="#B89B6A" stroke-width="2"/>
      <circle cx="0" cy="-20" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="40" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="100" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="160" r="4" fill="#B89B6A"/>
    
  </g>
</svg>