<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg-signature-safari-jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141712"/>
      <stop offset="100%" stop-color="#0B0D0A"/>
    </linearGradient>
    <radialGradient id="glow-signature-safari-jacket" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#B89B6A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B0D0A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg-signature-safari-jacket)"/>
  <rect width="800" height="1000" fill="url(#glow-signature-safari-jacket)"/>
  
  <!-- Subtle Framing -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#B89B6A" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Garment Illustration -->
  <g transform="translate(400, 520)">
    
      <!-- Safari Jacket Body -->
      <path d="M-140,260 L-130,-70 L-70,-115 C-40,-125 40,-125 70,-115 L130,-70 L140,260 Z"
        fill="#282C24" stroke="#B89B6A" stroke-opacity="0.45" stroke-width="2"/>
      
      <!-- Open Collar -->
      <path d="M-40,-118 L-20,-70 L0,-90 L20,-70 L40,-118 Z" 
        fill="#0E0E0E" stroke="#B89B6A" stroke-width="2"/>
      
      <!-- Four Bellows Pockets -->
      <!-- Top Left -->
      <rect x="-85" y="-30" width="45" height="50" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <path d="M-85,-20 L-40,-20" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Top Right -->
      <rect x="40" y="-30" width="45" height="50" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <path d="M40,-20 L85,-20" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Bottom Left -->
      <rect x="-95" y="100" width="55" height="65" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      <!-- Bottom Right -->
      <rect x="40" y="100" width="55" height="65" rx="3" fill="none" stroke="#B89B6A" stroke-width="1.5"/>
      
      <!-- Center Placket -->
      <line x1="0" y1="-70" x2="0" y2="260" stroke="#B89B6A" stroke-width="2"/>
      <circle cx="0" cy="-20" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="40" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="100" r="4" fill="#B89B6A"/>
      <circle cx="0" cy="160" r="4" fill="#B89B6A"/>
    
  </g>
  
  <!-- Brand and Title Header in SVG -->
  <text x="400" y="80" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.18em" fill="#F6F3EE">SIGNATURE SAFARI CUT</text>
  <text x="400" y="108" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.25em" fill="#B89B6A">EZEKIEL BESPOKE ATELIER</text>
  
  <!-- Placeholder indicator -->
  <rect x="300" y="920" width="200" height="26" rx="13" fill="#000000" fill-opacity="0.5" stroke="#B89B6A" stroke-opacity="0.25"/>
  <text x="400" y="937" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="0.15em" fill="#8A847C">PREVIEW PLACEHOLDER</text>
</svg>